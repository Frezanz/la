[package]
name = "la"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.114"
web-sys = { version = "0.3.91", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "Event",
  "EventTarget",
  "Node",
  "NodeList",
  "console"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
